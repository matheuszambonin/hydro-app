name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Testes e qualidade (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Dependências do sistema para Qt "offscreen" (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3

      - name: Instalar dependências (inclui dev)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Checagem de tipos (mypy)
        run: uv run mypy src/
        continue-on-error: true # ligue quando o typing estiver 100% coberto

      - name: Testes (pytest, com doctests, smoke da UI Qt e cobertura)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --cov=hydropump --cov-report=term-missing --cov-fail-under=70

  build-windows:
    name: Build do instalador Windows
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências (inclui build)
        run: uv sync --frozen --extra build

      - name: Smoke test do app (importa a janela principal sem exibi-la)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'src'); from hydropump.ui_qt.main_window import MainWindow; from PySide6.QtWidgets import QApplication; app = QApplication([]); w = MainWindow(); print('import e construção da janela OK')"

      - name: Gerar build PyInstaller (onedir)
        run: uv run pyinstaller app.spec --noconfirm --clean

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          curl -L -o is.exe https://jrsoftware.org/download.php/is.exe
          Start-Process -FilePath ./is.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

      - name: Compilar o instalador (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: HydroPump-installer
          path: installer_output/*.exe

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*.exe
          generate_release_notes: true
