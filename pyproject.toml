[project]
name = "hydropump"
version = "3.1.2"
description = "Interpretação de ensaios de bombeamento (Cooper-Jacob / Theis) em aquíferos livres"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "PySide6>=6.7,<6.8",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.1",
    "scipy>=1.13,<1.15",
    "matplotlib>=3.9,<3.10",
    "seaborn>=0.13,<0.14",
    "openpyxl>=3.1,<3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",  # smoke tests da UI Qt (opcional; ver tests/test_ui_smoke.py)
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]
build = [
    "pyinstaller>=6.10,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydropump"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--doctest-modules src/hydropump/domain/math.py --doctest-modules src/hydropump/io/mapping.py --doctest-modules src/hydropump/text.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # docstrings científicos com fórmulas passam de 100 colunas

[tool.mypy]
python_version = "3.11"
packages = ["hydropump"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/hydropump"]
omit = ["src/hydropump/ui_qt/*"]  # UI Qt é coberta por teste manual/smoke, não unitário
