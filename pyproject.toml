[project]
name = "hydropump"
version = "0.1.0"
description = "Pumping test analysis tool for hydrogeology"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0,<1.40.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.1.0",
    "scipy>=1.10.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<0.14.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pillow>=10.0.0,<11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.6.0",
]